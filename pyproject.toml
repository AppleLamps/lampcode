[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-cli"
version = "0.4.0"
description = "Codex-inspired local coding agent CLI powered by OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
agent = "cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools", "model", "approval", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
